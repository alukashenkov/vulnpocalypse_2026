name: Build & deploy CVE dashboard

on:
  schedule:
    # Hourly, around the clock. The dashboard reports through the last full UTC
    # day, so the day's build wants to land shortly after midnight; the gate
    # passes the first tick delivered at or after 00:30 UTC and stops once that
    # build has run. GitHub's scheduler is best-effort — it drops ticks and
    # delivers others hours late, sometimes leaving whole stretches of a day
    # empty — so every hour is another chance rather than a wasted run: a tick
    # that finds the day already built exits in seconds. Covering the late hours
    # is safe now: a tick delivered after midnight no longer burns a slot, it
    # simply becomes the new day's build.
    - cron: "30 0-23 * * *"
  workflow_dispatch: {}

# Read-only (plus Pages); the gate reads run history to see if today already
# deployed. The run never commits to the repo.
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Never run two builds at once; let a newer run supersede a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Decide whether to build this tick. Scheduled runs retry hourly and deploy at
  # most once per day (stop after the first success), so the day's build lands on
  # the first tick GitHub actually delivers after 00:30 UTC.
  #
  # Data freshness plays no part in that timing: every run downloads a fresh
  # snapshot and then applies a collection-update delta, so the archive is live
  # to the second whenever it runs. What the floor protects is the *window* — the
  # dashboard reports through the last full UTC day, so the run has to sit after
  # midnight, with a short margin for records published in the day's final
  # minutes to reach the archive.
  #
  # The dashboard also freezes on the full-2026 snapshot: scheduled runs stop
  # after 2027-01-01, and any run in 2027 is pinned to the 2026 set via
  # CVE_CUT_OFF_DATE=2026-12-31 (a naive year-boundary run would mishandle the
  # "current month"). Manual runs (workflow_dispatch) always proceed.
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      cutoff: ${{ steps.check.outputs.cutoff }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          today=$(date -u +%Y-%m-%d)
          proceed=true
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            if [[ "$today" > "2027-01-01" ]]; then
              echo "Frozen on the full-2026 snapshot; skipping."
              proceed=false
            elif (( 10#$(date -u +%H%M) < 30 )); then
              # Yesterday has only just closed; give records published in its
              # last minutes time to reach the archive. A tick this early is a
              # delayed one from yesterday — the 00:30 tick is right behind it.
              echo "Before 00:30 UTC; too early to build."
              proceed=false
            else
              # Stop retrying once today's build has deployed — or is under way,
              # since ticks now cluster around midnight and two arriving minutes
              # apart would otherwise both build. The current run is excluded:
              # its own build job is already pending while this gate runs, and
              # would veto itself.
              # Check the earliest runs of today first (reverse): the 00:30 UTC
              # build is usually the oldest run of the day, so reversing lets
              # subsequent hourly ticks stop on the first API check instead of
              # scanning every skipped tick before it.
              ids=$(gh api "repos/$REPO/actions/workflows/daily.yml/runs?created=>=${today}&per_page=50" \
                    --jq "[.workflow_runs[] | select(.created_at >= \"${today}T00:00:00Z\" and .id != ${{ github.run_id }}) | .id] | reverse | .[]")
              for id in $ids; do
                taken=$(gh api "repos/$REPO/actions/runs/$id/jobs" \
                  --jq 'any(.jobs[]; .name == "build-and-deploy" and (.conclusion == "success" or .status != "completed"))')
                if [[ "$taken" == "true" ]]; then
                  echo "Today's build already ran or is running (run $id); stopping retries."
                  proceed=false
                  break
                fi
              done
            fi
          fi
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"
          if [[ "$today" > "2026-12-31" ]]; then
            echo "cutoff=2026-12-31" >> "$GITHUB_OUTPUT"
          else
            echo "cutoff=" >> "$GITHUB_OUTPUT"
          fi

  build-and-deploy:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    env:
      # Deterministic set/dict ordering so table row ties render the same daily.
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v7

      # The decompressed archive is ~5.4 GB (~11 GB peak during delta merge).
      # Only reclaim space when under 20 GB free, targeting just the few
      # multi-GB SDK trees in parallel (~5-8s vs ~60s for full disk-cleanup actions).
      - name: Ensure disk space
        run: |
          avail_gb=$(df -BG --output=avail "${{ runner.temp }}" | tail -1 | tr -dc '0-9')
          echo "Available disk space on runner.temp: ${avail_gb} GB"
          if (( avail_gb < 20 )); then
            sudo rm -rf /usr/local/lib/android &
            sudo rm -rf /usr/share/dotnet &
            sudo rm -rf /opt/ghc &
            wait
            df -h "${{ runner.temp }}"
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Cache Matplotlib font list
        uses: actions/cache@v4
        with:
          path: ~/.cache/matplotlib
          key: mpl-fontcache-${{ runner.os }}-py312-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - uses: actions/configure-pages@v6

      - name: Build site
        env:
          DATA_DIR: ${{ runner.temp }}/data
          SITE_DIR: ${{ runner.temp }}/site
          VULNERS_API_KEY: ${{ secrets.VULNERS_API_KEY }}
          CVE_CUT_OFF_DATE: ${{ needs.gate.outputs.cutoff }}
        run: python -m src

      - name: Discard the downloaded archive
        if: always()
        run: rm -rf "${{ runner.temp }}/data"

      # deploy-pages looks the artifact up exactly once, right after the upload
      # finalizes, and GitHub's artifact listing is eventually consistent: on
      # 2026-11-21 and 2026-11-25 it returned "Found 0 artifacts" a second after
      # a successful upload, failing a finished build. Three guards:
      #  - the name carries the run attempt, so a re-run never sees the earlier
      #    attempt's artifact as well ("Multiple artifacts named github-pages",
      #    which is how the 2026-11-21 re-run failed);
      #  - the artifact is polled until the listing shows it;
      #  - a failed deploy is retried once after a pause.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site
          name: github-pages-${{ github.run_attempt }}

      - name: Wait for the artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: github-pages-${{ github.run_attempt }}
        run: |
          for i in $(seq 1 24); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=$NAME" --jq '.total_count' || echo 0)
            if [[ "$n" -ge 1 ]]; then echo "Artifact $NAME listed after ${i} check(s)."; exit 0; fi
            sleep 5
          done
          echo "::warning::Artifact $NAME still not listed after 2 minutes; deploying anyway."

      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Pause before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
