name: Build & deploy CVE dashboard

on:
  schedule:
    # Hourly, around the clock. The dashboard reports through the last full UTC
    # day, so the day's build wants to land shortly after midnight; the gate
    # passes the first tick delivered at or after 00:30 UTC and stops once that
    # build has run. GitHub's scheduler is best-effort — it drops ticks and
    # delivers others hours late, sometimes leaving whole stretches of a day
    # empty — so every hour is another chance rather than a wasted run: a tick
    # that finds the day already built exits in seconds. Covering the late hours
    # is safe now: a tick delivered after midnight no longer burns a slot, it
    # simply becomes the new day's build.
    - cron: "30 0-23 * * *"
  workflow_dispatch: {}

# Read-only (plus Pages); the gate reads run history to see if today already
# deployed. The run never commits to the repo.
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Never run two builds at once; let a newer run supersede a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Decide whether to build this tick. Scheduled runs retry hourly and deploy at
  # most once per day (stop after the first success), so the day's build lands on
  # the first tick GitHub actually delivers after 00:30 UTC.
  #
  # Data freshness plays no part in that timing: every run downloads a fresh
  # snapshot and then applies a collection-update delta, so the archive is live
  # to the second whenever it runs. What the floor protects is the *window* — the
  # dashboard reports through the last full UTC day, so the run has to sit after
  # midnight, with a short margin for records published in the day's final
  # minutes to reach the archive.
  #
  # The dashboard also freezes on the full-2026 snapshot: scheduled runs stop
  # after 2027-01-01, and any run in 2027 is pinned to the 2026 set via
  # CVE_CUT_OFF_DATE=2026-12-31 (a naive year-boundary run would mishandle the
  # "current month"). Manual runs (workflow_dispatch) always proceed.
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      cutoff: ${{ steps.check.outputs.cutoff }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          today=$(date -u +%Y-%m-%d)
          proceed=true
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            if [[ "$today" > "2027-01-01" ]]; then
              echo "Frozen on the full-2026 snapshot; skipping."
              proceed=false
            elif (( 10#$(date -u +%H%M) < 30 )); then
              # Yesterday has only just closed; give records published in its
              # last minutes time to reach the archive. A tick this early is a
              # delayed one from yesterday — the 00:30 tick is right behind it.
              echo "Before 00:30 UTC; too early to build."
              proceed=false
            else
              # Stop retrying once today's build has deployed — or is under way,
              # since ticks now cluster around midnight and two arriving minutes
              # apart would otherwise both build. The current run is excluded:
              # its own build job is already pending while this gate runs, and
              # would veto itself.
              ids=$(gh api "repos/$REPO/actions/workflows/daily.yml/runs?per_page=50" \
                    --jq "[.workflow_runs[] | select(.created_at >= \"${today}T00:00:00Z\" and .id != ${{ github.run_id }}) | .id] | .[]")
              for id in $ids; do
                taken=$(gh api "repos/$REPO/actions/runs/$id/jobs" \
                  --jq 'any(.jobs[]; .name == "build-and-deploy" and (.conclusion == "success" or .status != "completed"))')
                if [[ "$taken" == "true" ]]; then
                  echo "Today's build already ran or is running (run $id); stopping retries."
                  proceed=false
                  break
                fi
              done
            fi
          fi
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"
          if [[ "$today" > "2026-12-31" ]]; then
            echo "cutoff=2026-12-31" >> "$GITHUB_OUTPUT"
          else
            echo "cutoff=" >> "$GITHUB_OUTPUT"
          fi

  build-and-deploy:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Deterministic set/dict ordering so table row ties render the same daily.
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v7

      # The decompressed archive is ~5.4 GB; reclaim space as cheap insurance.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          large-packages: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - uses: actions/configure-pages@v6

      - name: Build site
        env:
          DATA_DIR: ${{ runner.temp }}/data
          SITE_DIR: ${{ runner.temp }}/site
          VULNERS_API_KEY: ${{ secrets.VULNERS_API_KEY }}
          CVE_CUT_OFF_DATE: ${{ needs.gate.outputs.cutoff }}
        run: python -m src

      - name: Discard the downloaded archive
        if: always()
        run: rm -rf "${{ runner.temp }}/data"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

      - id: deployment
        uses: actions/deploy-pages@v5
